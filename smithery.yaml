startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      AQB_KEY:
        type: string
        description: Private key of a registered agent or its ECDSA fallback (funded with USDC on Base for minting).
    required:
      - AQB_KEY
  commandFunction: |-
    (config) => ({ command: "npx", args: ["-y", "@aqb-foundation/aqb-agent", "mcp"], env: { AQB_KEY: config.AQB_KEY } })
